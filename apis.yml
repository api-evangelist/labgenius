aid: labgenius
name: LabGenius Therapeutics
description: LabGenius Therapeutics is a London-based drug discovery company that combines machine
  learning, high-throughput robotic experimentation and synthetic biology to discover and co-optimise
  next-generation therapeutic antibodies for solid tumours. Its EVA (Experimental Vector Automation)
  platform is a closed-loop, modality-agnostic discovery engine that runs a design-build-test-learn
  cycle in under six weeks — computationally designing multispecific antibodies in the dry lab, then
  cloning, expressing, purifying and functionally screening up to 2,300 multispecifics per cycle in an
  automated wet lab, and feeding the resulting proprietary data back into multi-objective ML models.
  The company operates a wholly-owned pipeline of selectivity-enhanced T-cell engagers alongside
  partnered antibody-optimisation programmes with Sanofi. LabGenius is a pre-clinical therapeutics
  company and publishes no public developer API, developer portal, or SDKs; this profile captures its
  public web and machine-readable surface only.
